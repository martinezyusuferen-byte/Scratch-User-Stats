openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Scratch Analyzer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scratch
    description: Scratch user analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scratch/user/{username}:
    get:
      operationId: getScratchUser
      tags: [scratch]
      summary: Get Scratch user analysis
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScratchUserAnalysis"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scratch/user/{username}/projects:
    get:
      operationId: getScratchUserProjects
      tags: [scratch]
      summary: Get user projects with stats
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User projects list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScratchProjectsResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    ScratchProject:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnail_url:
          type: string
        loves:
          type: integer
        favorites:
          type: integer
        views:
          type: integer
        remixes:
          type: integer
        created:
          type: string
        modified:
          type: string
        share_date:
          type: string
        comments_allowed:
          type: boolean
        url:
          type: string
      required:
        - id
        - title
        - loves
        - favorites
        - views
        - remixes
        - created
        - modified
        - url

    ScratchUserAnalysis:
      type: object
      properties:
        username:
          type: string
        profile:
          $ref: "#/components/schemas/ScratchProfile"
        stats:
          $ref: "#/components/schemas/ScratchStats"
        insights:
          $ref: "#/components/schemas/ScratchInsights"
        score:
          $ref: "#/components/schemas/ScratchScore"
        top_projects:
          type: array
          items:
            $ref: "#/components/schemas/ScratchProject"
        activity:
          $ref: "#/components/schemas/ScratchActivity"
        advanced:
          $ref: "#/components/schemas/ScratchAdvanced"
      required:
        - username
        - profile
        - stats
        - insights
        - score
        - top_projects
        - activity
        - advanced

    ScratchProfile:
      type: object
      properties:
        username:
          type: string
        id:
          type: integer
        bio:
          type: string
        work:
          type: string
        country:
          type: string
        status:
          type: string
        join_date:
          type: string
        avatar_url:
          type: string
        scratch_team:
          type: boolean
      required:
        - username
        - id
        - join_date
        - avatar_url
        - scratch_team

    ScratchStats:
      type: object
      properties:
        followers:
          type: integer
        following:
          type: integer
        total_projects:
          type: integer
        total_loves:
          type: integer
        total_favorites:
          type: integer
        total_views:
          type: integer
        total_remixes:
          type: integer
        total_comments:
          type: integer
        average_loves_per_project:
          type: number
        average_views_per_project:
          type: number
        love_to_view_ratio:
          type: number
        remix_rate:
          type: number
        days_on_scratch:
          type: integer
        projects_per_month:
          type: number
        batma_orani:
          type: number
          description: "Batma Oranı: görüntüleyip sevmeyen kullanıcı yüzdesi"
        etkilesim_orani:
          type: number
          description: "Etkileşim Oranı: (sevgi+favori+yorum)/görüntüleme*100"
        yorum_orani:
          type: number
          description: "Proje başına düşen ortalama yorum"
        takip_orani:
          type: number
          description: "Takipçi/Takip edilen oranı"
        gunluk_ortalama_goruntuleme:
          type: number
          description: "Günlük ortalama görüntülenme"
        verimlilik_skoru:
          type: number
          description: "Proje başına etkileşim verimliliği"
      required:
        - followers
        - following
        - total_projects
        - total_loves
        - total_favorites
        - total_views
        - total_remixes
        - total_comments
        - average_loves_per_project
        - average_views_per_project
        - love_to_view_ratio
        - remix_rate
        - days_on_scratch
        - projects_per_month
        - batma_orani
        - etkilesim_orani
        - yorum_orani
        - takip_orani
        - gunluk_ortalama_goruntuleme
        - verimlilik_skoru

    ScratchInsights:
      type: object
      properties:
        guclu_yonler:
          type: array
          items:
            type: string
        gelistirilecek_yonler:
          type: array
          items:
            type: string
        buyume_onerileri:
          type: array
          items:
            $ref: "#/components/schemas/GrowthTip"
        icerik_turu:
          type: string
        aktivite_seviyesi:
          type: string
        etkilesim_kalitesi:
          type: string
        buyume_trendi:
          type: string
          description: "Yükselen / Sabit / Düşen"
        en_iyi_paylasim_zamani:
          type: string
        icerik_tutarliligi:
          type: string
      required:
        - guclu_yonler
        - gelistirilecek_yonler
        - buyume_onerileri
        - icerik_turu
        - aktivite_seviyesi
        - etkilesim_kalitesi
        - buyume_trendi
        - en_iyi_paylasim_zamani
        - icerik_tutarliligi

    GrowthTip:
      type: object
      properties:
        kategori:
          type: string
        oneri:
          type: string
        oncelik:
          type: string
          enum: [yuksek, orta, dusuk]
        etki:
          type: string
      required:
        - kategori
        - oneri
        - oncelik
        - etki

    ScratchScore:
      type: object
      properties:
        genel:
          type: integer
        etkilesim:
          type: integer
        yaraticilik:
          type: integer
        topluluk:
          type: integer
        tutarlilik:
          type: integer
        buyume_potansiyeli:
          type: integer
        rutbe:
          type: string
        rutbe_ikonu:
          type: string
        yuzdeLik:
          type: number
      required:
        - genel
        - etkilesim
        - yaraticilik
        - topluluk
        - tutarlilik
        - buyume_potansiyeli
        - rutbe
        - rutbe_ikonu
        - yuzdeLik

    ScratchActivity:
      type: object
      properties:
        son_proje_tarihi:
          type: string
          nullable: true
        aktif_mi:
          type: boolean
        aktivite_serisi:
          type: integer
        aylik_projeler:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyActivity"
      required:
        - aktif_mi
        - aktivite_serisi
        - aylik_projeler

    MonthlyActivity:
      type: object
      properties:
        ay:
          type: string
        sayi:
          type: integer
      required:
        - ay
        - sayi

    ScratchAdvanced:
      type: object
      properties:
        en_iyi_proje:
          $ref: "#/components/schemas/ScratchProject"
          nullable: true
        en_cok_izlenen:
          $ref: "#/components/schemas/ScratchProject"
          nullable: true
        remix_edilme_orani:
          type: number
          description: "1000 görüntülemede kaç kez remix edildi"
        topluluk_etkisi:
          type: string
          description: "Topluluk üzerindeki etki seviyesi"
        hesap_yaslanma_hizi:
          type: string
          description: "Proje üretme hızına göre hesap olgunluğu"
        tahmini_aylik_buyume:
          type: number
          description: "Tahmini aylık takipçi büyüme yüzdesi"
        karsilastirma_skoru:
          type: string
          description: "Benzer kullanıcılarla kıyasla"
        onerilen_tur:
          type: string
          description: "Daha iyi performans için önerilen proje türü"
        zayif_proje_orani:
          type: number
          description: "100'den az görüntüleme alan proje yüzdesi"
        guclu_proje_orani:
          type: number
          description: "1000+ görüntüleme alan proje yüzdesi"
      required:
        - remix_edilme_orani
        - topluluk_etkisi
        - hesap_yaslanma_hizi
        - tahmini_aylik_buyume
        - karsilastirma_skoru
        - onerilen_tur
        - zayif_proje_orani
        - guclu_proje_orani

    ScratchProjectsResponse:
      type: object
      properties:
        username:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ScratchProject"
        total:
          type: integer
      required:
        - username
        - projects
        - total
