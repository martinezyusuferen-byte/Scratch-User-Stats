openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Scratch Analyzer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scratch
    description: Scratch user analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scratch/user/{username}:
    get:
      operationId: getScratchUser
      tags: [scratch]
      summary: Get Scratch user analysis
      description: Fetches and analyzes a Scratch user profile with statistics and insights
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScratchUserAnalysis"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scratch/user/{username}/projects:
    get:
      operationId: getScratchUserProjects
      tags: [scratch]
      summary: Get user projects with stats
      description: Returns all public projects with detailed statistics for a Scratch user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User projects list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScratchProjectsResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    ScratchProject:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnail_url:
          type: string
        loves:
          type: integer
        favorites:
          type: integer
        views:
          type: integer
        remixes:
          type: integer
        created:
          type: string
        modified:
          type: string
        share_date:
          type: string
        comments_allowed:
          type: boolean
        url:
          type: string
      required:
        - id
        - title
        - loves
        - favorites
        - views
        - remixes
        - created
        - modified
        - url

    ScratchUserAnalysis:
      type: object
      properties:
        username:
          type: string
        profile:
          $ref: "#/components/schemas/ScratchProfile"
        stats:
          $ref: "#/components/schemas/ScratchStats"
        insights:
          $ref: "#/components/schemas/ScratchInsights"
        score:
          $ref: "#/components/schemas/ScratchScore"
        top_projects:
          type: array
          items:
            $ref: "#/components/schemas/ScratchProject"
        activity:
          $ref: "#/components/schemas/ScratchActivity"
      required:
        - username
        - profile
        - stats
        - insights
        - score
        - top_projects
        - activity

    ScratchProfile:
      type: object
      properties:
        username:
          type: string
        id:
          type: integer
        bio:
          type: string
        work:
          type: string
        country:
          type: string
        status:
          type: string
        join_date:
          type: string
        avatar_url:
          type: string
        scratch_team:
          type: boolean
      required:
        - username
        - id
        - join_date
        - avatar_url
        - scratch_team

    ScratchStats:
      type: object
      properties:
        followers:
          type: integer
        following:
          type: integer
        total_projects:
          type: integer
        total_loves:
          type: integer
        total_favorites:
          type: integer
        total_views:
          type: integer
        total_remixes:
          type: integer
        total_comments:
          type: integer
        average_loves_per_project:
          type: number
        average_views_per_project:
          type: number
        love_to_view_ratio:
          type: number
        remix_rate:
          type: number
        days_on_scratch:
          type: integer
        projects_per_month:
          type: number
      required:
        - followers
        - following
        - total_projects
        - total_loves
        - total_favorites
        - total_views
        - total_remixes
        - total_comments
        - average_loves_per_project
        - average_views_per_project
        - love_to_view_ratio
        - remix_rate
        - days_on_scratch
        - projects_per_month

    ScratchInsights:
      type: object
      properties:
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        growth_tips:
          type: array
          items:
            $ref: "#/components/schemas/GrowthTip"
        creator_type:
          type: string
        activity_level:
          type: string
        engagement_quality:
          type: string
        best_performing_category:
          type: string
      required:
        - strengths
        - weaknesses
        - growth_tips
        - creator_type
        - activity_level
        - engagement_quality

    GrowthTip:
      type: object
      properties:
        category:
          type: string
        tip:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        impact:
          type: string
      required:
        - category
        - tip
        - priority
        - impact

    ScratchScore:
      type: object
      properties:
        overall:
          type: integer
        engagement:
          type: integer
        creativity:
          type: integer
        community:
          type: integer
        consistency:
          type: integer
        growth_potential:
          type: integer
        rank:
          type: string
        rank_icon:
          type: string
        percentile:
          type: number
      required:
        - overall
        - engagement
        - creativity
        - community
        - consistency
        - growth_potential
        - rank
        - rank_icon
        - percentile

    ScratchActivity:
      type: object
      properties:
        last_project_date:
          type: string
          nullable: true
        is_active:
          type: boolean
        activity_streak:
          type: integer
        monthly_projects:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyActivity"
      required:
        - is_active
        - activity_streak
        - monthly_projects

    MonthlyActivity:
      type: object
      properties:
        month:
          type: string
        count:
          type: integer
      required:
        - month
        - count

    ScratchProjectsResponse:
      type: object
      properties:
        username:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ScratchProject"
        total:
          type: integer
      required:
        - username
        - projects
        - total
