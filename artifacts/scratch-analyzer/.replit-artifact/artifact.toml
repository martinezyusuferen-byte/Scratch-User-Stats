kind = "web"
previewPath = "/"
title = "Scratch Analyzer"
version = "1.0.0"
id = "artifacts/scratch-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20014

[services.development]
run = "pnpm --filter @workspace/scratch-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scratch-analyzer", "run", "build" ]
publicDir = "artifacts/scratch-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20014"
BASE_PATH = "/"
